[package]
name = "video_compress_gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = "0.29"
rfd = "0.15"

# Réduit la taille du binaire distribué avec `cargo build --release`.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
